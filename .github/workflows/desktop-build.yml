name: Windows and Linux desktop builds

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PROJECT_MANAGER_DATA: ${{ github.workspace }}/.ci-data
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 libgl1 libegl1 libglib2.0-0 libdbus-1-3 libnotify-bin
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install 'pywebview==6.1' 'pyinstaller==6.17.0' 'certifi'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: python -m pip install 'pywebview[qt]==6.1' 'pyinstaller==6.17.0' 'certifi'
      - name: Run unit and integration tests
        run: |
          python test_desktop.py
          python test_integration.py
          node --check app.js
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean desktop.spec
      - name: Test packaged desktop on Linux
        if: runner.os == 'Linux'
        run: timeout 60 xvfb-run -a dist/ProjectWorkspace/ProjectWorkspace --smoke
      - name: Test packaged desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/ProjectWorkspace/ProjectWorkspace.exe' -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(75000)) { $p.Kill(); throw 'Desktop smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test failed with exit code $($p.ExitCode)" }
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar -C dist -czf ProjectWorkspace-linux-x86_64.tar.gz ProjectWorkspace
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ProjectWorkspace -DestinationPath ProjectWorkspace-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ProjectWorkspace-${{ matrix.platform }}.*
          if-no-files-found: error
