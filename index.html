<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目工作台</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><span>工</span><div>项目工作台<small>LOCAL WORKSPACE</small></div></div><div class="side-label">工作空间</div><nav><button data-view="dashboard">◫　总览</button><button data-view="list">☰　任务列表</button><button data-view="board">▥　看板</button><button data-view="gantt">▤　甘特图</button><button data-view="reminders">◷　待办与提醒</button><button data-view="reports">▧　日报 / 周报</button><button data-view="ai">✧　AI 助手</button><button data-view="sharing">♧　局域网协作</button></nav><div class="side-label project-label">项目 <button id="addProject" title="新建项目">＋</button></div><div id="projects"></div><div class="side-bottom"><span id="connection">● 数据保存在主机</span><br><button id="export">导出 JSON 备份</button><button id="import">导入备份副本</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></aside>
<main><header><div><div class="breadcrumb">工作空间 <span>/</span> <span id="crumb">总览</span></div><h1 id="heading">总览</h1><p id="subtitle"></p></div><div class="header-actions"><select id="projectSelect" aria-label="选择项目"></select><button id="addTask" class="primary">＋ 新建任务</button></div></header><div id="content"></div></main>
<dialog id="taskDialog"><form id="taskForm"><div class="modal-head"><h2 id="taskTitle">新建任务</h2><button type="button" class="close" data-close>×</button></div><input name="id" type="hidden"><label>任务名称<input name="title" required placeholder="例如：完成需求评审"></label><div class="grid"><label>所属项目<select name="project_id" required></select></label><label>负责人<input name="owner" placeholder="多人用逗号分隔"></label><label>状态<select name="status"><option>待开始</option><option>进行中</option><option>已阻塞</option><option>已完成</option></select></label><label>优先级<select name="priority"><option>低</option><option selected>中</option><option>高</option><option>紧急</option></select></label><label>计划开始<input type="date" name="start_date"></label><label>计划完成<input type="date" name="due_date"></label><label>实际开始<input type="date" name="actual_start"></label><label>实际完成<input type="date" name="actual_end"></label></div><label>标签 <small>多个标签用逗号分隔</small><input name="tags" placeholder="例如：设计, 待评审"></label><label>子任务 <small>每行一项，在行首输入 [x] 表示完成</small><textarea name="subtasks" rows="3" placeholder="[ ] 梳理需求&#10;[x] 与团队对齐"></textarea></label><label>备注<textarea name="notes" rows="3"></textarea></label><div class="modal-actions"><button type="button" class="danger" id="deleteTask">删除任务</button><div><button type="button" data-close>取消</button><button class="primary">保存任务</button></div></div></form></dialog>
<dialog id="projectDialog"><form id="projectForm"><div class="modal-head"><h2>新建项目</h2><button type="button" data-close class="close">×</button></div><label>项目名称<input name="name" required autofocus></label><label>项目说明<textarea name="description" rows="3"></textarea></label><div class="modal-actions"><span></span><button class="primary">创建项目</button></div></form></dialog>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
